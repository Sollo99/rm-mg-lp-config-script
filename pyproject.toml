[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rm-mg-lp"
version = "0.1.2"
description = "Standalone Linux control utility for Rise Mode RM-MG-LP"
requires-python = ">=3.10"
dependencies = ["pyusb>=1.3"]

[project.scripts]
rm-mg-lpctl = "rmmglp.cli:main"
rm-mg-lp-gui = "rmmglp.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
